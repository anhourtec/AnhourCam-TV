name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste emails, passwords, device serials/IDs, IP addresses or camera images.**"
  - type: input
    id: device
    attributes: { label: TV device and OS version, placeholder: "Chromecast with Google TV, Android TV 12" }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: AnhourCam TV version }
  - type: textarea
    id: what
    attributes: { label: What happened and what you expected }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
